name: Docker to ECR

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t myimage:latest .

      - name: Push image to ECR
        run: |
          docker tag myimage:latest \
            ${{ steps.ecr.outputs.registry }}/test-varinder:latest

          docker push \
            ${{ steps.ecr.outputs.registry }}/test-varinder:latest

      - name: Deploy to EC2
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.ap-south-1.amazonaws.com"
          IMAGE="${ECR_REGISTRY}/test-varinder:latest"

          cat > ssm-commands.json <<EOF
          {
            "commands": [
              "aws ecr get-login-password --region ap-south-1 | sudo docker login --username AWS --password-stdin ${ECR_REGISTRY}",
              "sudo docker pull ${IMAGE}",
              "sudo docker stop myapp || true",
              "sudo docker rm myapp || true",
              "sudo docker run -d --name myapp -p 8080:80 ${IMAGE}"
            ]
          }
          EOF

          aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file://ssm-commands.json \
            --region ap-south-1
