name: Docker to ECR

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Get source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Authenticate GitHub Actions with AWS
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      # 3. Login to ECR
      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Build Docker image
      - name: Build Docker image
        run: |
          docker build -t myimage:latest .

      # 5. Push image to ECR
      - name: Push image to ECR
        run: |
          docker tag myimage:latest \
            ${{ steps.ecr.outputs.registry }}/test-varinder:latest

          docker push \
            ${{ steps.ecr.outputs.registry }}/test-varinder:latest

      # 6. Deploy latest image to EC2
      - name: Deploy to EC2
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "aws ecr get-login-password --region ap-south-1 | sudo docker login --username AWS --password-stdin '${{ secrets.AWS_ACCOUNT_ID }}'.dkr.ecr.ap-south-1.amazonaws.com",
              "sudo docker pull '${{ secrets.AWS_ACCOUNT_ID }}'.dkr.ecr.ap-south-1.amazonaws.com/test-varinder:latest",
              "sudo docker stop myapp || true",
              "sudo docker rm myapp || true",
              "sudo docker run -d --name myapp -p 8080:80 '${{ secrets.AWS_ACCOUNT_ID }}'.dkr.ecr.ap-south-1.amazonaws.com/test-varinder:latest"
            ]' \
            --region ap-south-1
